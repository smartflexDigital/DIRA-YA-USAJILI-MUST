<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dira ya Usajili — MUST</title>
<style>
  :root{
    --wa-dark:#08121f;
    --wa-panel:#0d1b2e;
    --wa-green:#2e9e5b;
    --wa-green-deep:#1c6b3c;
    --must-blue:#1a4d8f;
    --must-blue-deep:#0f3164;
    --bubble-in:#16273d;
    --bubble-out:#0f3164;
    --paper:#eef2f6;
    --ink:#08121f;
    --muted:#7e8ea3;
    --accent:#ffb454;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(26,77,143,0.22), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(46,158,91,0.14), transparent 40%),
      var(--wa-dark);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 14px 60px;
    color:var(--paper);
  }
  header{
    text-align:center;
    max-width:520px;
    margin-bottom:22px;
  }
  .eyebrow{
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--accent);
    font-weight:700;
    margin-bottom:8px;
  }
  h1{
    font-size:26px;
    margin:0 0 8px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  header p{
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
    margin:0;
  }

  .phone{
    width:100%;
    max-width:380px;
    height:700px;
    background:#000;
    border-radius:38px;
    padding:12px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
    position:relative;
  }
  .screen{
    background:var(--wa-panel);
    height:100%;
    border-radius:28px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .notch{
    position:absolute;
    top:12px; left:50%; transform:translateX(-50%);
    width:120px; height:22px;
    background:#000;
    border-radius:14px;
    z-index:5;
  }
  .chat-header{
    background:#0f2038;
    padding:34px 16px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid rgba(255,255,255,0.07);
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,var(--must-blue),var(--wa-green-deep));
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#eef2f6;font-size:13px;
  }
  .chat-title{font-weight:700;font-size:15px;}
  .chat-sub{font-size:11px;color:var(--wa-green);}

  .messages{
    flex:1;
    overflow-y:auto;
    padding:14px 12px;
    background-image: linear-gradient(rgba(11,26,23,0.97), rgba(11,26,23,0.97));
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .msg{
    max-width:80%;
    padding:9px 12px;
    border-radius:12px;
    font-size:13.5px;
    line-height:1.45;
    animation:pop .22s ease-out;
    white-space:pre-line;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .msg.bot{
    background:var(--bubble-in);
    align-self:flex-start;
    border-top-left-radius:3px;
  }
  .msg.me{
    background:var(--bubble-out);
    align-self:flex-end;
    border-top-right-radius:3px;
  }
  .msg .time{
    display:block;
    font-size:10px;
    color:var(--muted);
    margin-top:4px;
    text-align:right;
  }
  .quick-replies{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding:4px 4px 8px;
    align-self:flex-start;
    max-width:90%;
  }
  .qr-btn{
    background:transparent;
    border:1px solid var(--wa-green);
    color:#7fd39f;
    padding:7px 12px;
    border-radius:20px;
    font-size:12.5px;
    cursor:pointer;
    transition:.15s;
    font-weight:600;
  }
  .qr-btn:hover{background:rgba(46,158,91,0.16);}
  .qr-btn:disabled{opacity:.35;cursor:default;}

  .typing{
    align-self:flex-start;
    display:flex;
    gap:4px;
    background:var(--bubble-in);
    padding:10px 14px;
    border-radius:12px;
    border-top-left-radius:3px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--muted);
    animation:blink 1.1s infinite;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,60%,100%{opacity:.3;}30%{opacity:1;}}

  .composer{
    background:#0f2038;
    padding:10px;
    display:flex;
    gap:8px;
    border-top:1px solid rgba(255,255,255,0.07);
  }
  .composer input{
    flex:1;
    background:#0a1728;
    border:none;
    border-radius:20px;
    padding:10px 14px;
    color:var(--paper);
    font-size:13px;
    outline:none;
  }
  .composer button{
    background:var(--wa-green);
    color:#08121f;
    border:none;
    width:38px;height:38px;
    border-radius:50%;
    font-weight:800;
    cursor:pointer;
    flex-shrink:0;
  }
  .composer button:disabled{opacity:.4;cursor:default;}

  .caption{
    max-width:380px;
    margin-top:18px;
    text-align:center;
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
  }
  .caption b{color:var(--accent);}
  .reset{
    margin-top:12px;
    background:none;
    border:1px solid var(--muted);
    color:var(--muted);
    padding:8px 16px;
    border-radius:20px;
    font-size:12px;
    cursor:pointer;
  }
  .reset:hover{border-color:var(--wa-green);color:var(--wa-green);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">MUST &middot; Usajili wa First Year</div>
  <h1>Dira ya Usajili</h1>
  <p>Mfumo unaomwongoza kila first year hatua kwa hatua — kabla na wakati wa siku ya usajili MUST. Bofya chaguo au andika ujumbe kuiendesha.</p>
</header>

<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="chat-header">
      <div class="avatar">MU</div>
      <div>
        <div class="chat-title">Dira ya Usajili — MUST</div>
        <div class="chat-sub">bot &middot; Mbeya University of Science and Technology</div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input id="textInput" type="text" placeholder="Andika ujumbe..." />
      <button id="sendBtn">&#10148;</button>
    </div>
  </div>
</div>

<button class="reset" onclick="location.reload()">Anza upya</button>

<script>
const messagesEl = document.getElementById('messages');
const input = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');

let state = 'start'; // start -> gotName -> menu -> queue/faq/schedule
let studentName = '';

function timeNow(){
  const d = new Date();
  return d.toLocaleTimeString('sw-TZ',{hour:'2-digit',minute:'2-digit'});
}

function addBotMsg(text, delay=650){
  return new Promise(resolve=>{
    const typing = document.createElement('div');
    typing.className='typing';
    typing.innerHTML='<span></span><span></span><span></span>';
    messagesEl.appendChild(typing);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    setTimeout(()=>{
      typing.remove();
      const div = document.createElement('div');
      div.className='msg bot';
      div.innerHTML = text.replace(/\n/g,'<br>') + `<span class="time">${timeNow()}</span>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      resolve();
    }, delay);
  });
}

function addMeMsg(text){
  const div = document.createElement('div');
  div.className='msg me';
  div.innerHTML = text.replace(/\n/g,'<br>') + `<span class="time">${timeNow()}</span>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addQuickReplies(options){
  const wrap = document.createElement('div');
  wrap.className='quick-replies';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className='qr-btn';
    btn.textContent = opt.label;
    btn.onclick = ()=>{
      Array.from(wrap.children).forEach(b=>b.disabled=true);
      addMeMsg(opt.label);
      opt.action();
    };
    wrap.appendChild(btn);
  });
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function showMainMenu(){
  await addBotMsg(`Karibu tena, ${studentName || 'mwanafunzi'} 👋\nNaweza kukusaidia na nini?`, 500);
  addQuickReplies([
    {label:'📅 Ratiba yangu ya usajili', action: showSchedule},
    {label:'⏱️ Nafasi yangu ya foleni', action: showQueue},
    {label:'❓ Maswali ya kawaida', action: showFaqMenu},
  ]);
}

async function showSchedule(){
  await addBotMsg(`📅 Ratiba yako ya usajili — MUST 2026/2027\n\nSiku: Jumatatu, tarehe 11\nSaa: 3:00 asubuhi\nKituo: NYERERE HALL (majina A–H)\nUlete: kitambulisho cha NECTA/cheti, risiti ya ada, picha 4 passport, fomu ya uthibitisho`, 700);
  addQuickReplies([
    {label:'⬅️ Rudi menyu kuu', action: showMainMenu},
  ]);
}

async function showQueue(){
  await addBotMsg(`⏱️ NYERERE HALL — Dirisha 2\nUko namba 12 kwenye foleni.\nWatu 3 wako mbele yako.\nMuda uliosalia: dakika 8 hivi.\n\nUnaweza kukaa chini nje ya ukumbi na kupumzika, tutakujulisha ukikaribia.`, 700);
  addQuickReplies([
    {label:'⬅️ Rudi menyu kuu', action: showMainMenu},
  ]);
}

async function showFaqMenu(){
  await addBotMsg(`❓ Chagua swali:`, 400);
  addQuickReplies([
    {label:'Nalipa ada wapi?', action: ()=>answerFaq('💳 Malipo ya ada yanathibitishwa kwenye dirisha la fedha lililopo ACADEMIC BLOCK, ghorofa ya chini. Lete risiti ya benki/control number kabla ya kuja NYERERE HALL kwa uthibitisho wa mwisho.')},
    {label:'Naandikishwa bima ya afya wapi?', action: ()=>answerFaq('🏥 Usajili wa bima ya afya (NHIF) unafanyika ACADEMIC BLOCK, chumba cha huduma za wanafunzi — kituo kiko karibu na mlango wa pili.')},
    {label:'Napata wapi ID/library card?', action: ()=>answerFaq('🪪 Kitambulisho cha mwanafunzi na library card vinatolewa MAGUFULI LIBRARY, dirisha la usajili wa wapya — baada ya kuthibitishwa NYERERE HALL.')},
    {label:'Choo kiko wapi?', action: ()=>answerFaq('🚻 Choo cha karibu kiko nyuma ya NYERERE HALL, upande wa magharibi wa jengo.')},
    {label:'Nimesahau kitu, nifanyeje?', action: ()=>answerFaq('📋 Mwambie yeyote wa "Welcome Buddy" aliye na beji ya kijani karibu na NYERERE HALL — atakuelekeza bila kuvunja zamu yako.')},
    {label:'⬅️ Rudi menyu kuu', action: showMainMenu},
  ]);
}

async function answerFaq(text){
  await addBotMsg(text, 600);
  addQuickReplies([
    {label:'❓ Swali lingine', action: showFaqMenu},
    {label:'⬅️ Rudi menyu kuu', action: showMainMenu},
  ]);
}

async function startFlow(){
  await addBotMsg('Habari! Karibu kwenye usajili wa First Year 🎓\nMimi ni "Dira ya Usajili" — nitakusaidia hatua kwa hatua.', 500);
  await addBotMsg('Tafadhali andika jina lako la kwanza tu, au bofya "Endelea" kujaribu demo.', 500);
  addQuickReplies([
    {label:'Endelea (jina: Amani)', action: ()=>{ studentName='Amani'; showMainMenu(); }},
  ]);
}

function handleFreeText(text){
  addMeMsg(text);
  if(state==='start'){
    studentName = text.split(' ')[0];
    state='menu';
    showMainMenu();
  } else {
    addBotMsg('Samahani, kwa demo hii tumia vitufe vilivyo hapo juu ili kuendesha mazungumzo 🙂', 500);
  }
}

sendBtn.onclick = ()=>{
  const val = input.value.trim();
  if(!val) return;
  handleFreeText(val);
  input.value='';
};
input.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ sendBtn.click(); }
});

startFlow();
</script>

</body>
</html>
